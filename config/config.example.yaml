# Copy this file to config.yaml and adjust. config.yaml is gitignored.

root_path: "P:\\"

# Only these top-level folders are treated as project archive years.
# Everything else at the root (admin folders, shortcuts, loose files) is skipped.
year_folder_pattern: "^TRABAJOS (\\d{4})$"

# Names to skip entirely, anywhere in the tree (sync/recycle artifacts etc.)
ignore_names:
  - "#recycle"
  - "_gsdata_"
  - "Thumbs.db"
  - ".DS_Store"

db_path: "data/index.db"
